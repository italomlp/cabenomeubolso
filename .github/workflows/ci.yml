name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test (Node 22.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  maestro-syntax:
    name: Maestro flow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Best-effort gate: validates Maestro flow syntax only when the CLI is
      # present on the runner. Install Maestro (and Java) here to make it a
      # hard gate.
      - name: Validate Maestro flows
        env:
          MAESTRO_OPTIONAL: "1"
        run: bash scripts/validate-maestro-flows.sh
